spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  docker:
    compose:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

jwt:
  secret-key: ${JWT_SECRET_KEY}

minio:
  endpoint: ${MINIO_ENDPOINT}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  presigned-url-expiry-minutes: ${MINIO_PRESIGNED_URL_EXPIRY_MINUTES:60}

socketio:
  server:
    cors:
      allowed-origins: ${SOCKETIO_ALLOWED_ORIGINS}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  security:
    trusted-proxies: ${TRUSTED_PROXIES}
    cookies:
      secure: ${AUTH_COOKIE_SECURE:true}
      domain: ${AUTH_COOKIE_DOMAIN:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
